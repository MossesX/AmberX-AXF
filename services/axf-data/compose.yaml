# axf-data as a Coolify "Docker Compose" resource (the same shape deploy/install-data.sh runs by hand).
# Private app: no ports, no domain, no Traefik labels. Clients (the console, axHub, headless build sessions) join the
# `axf-data` network and call http://axf-data:7700. Build context: run deploy/install-data.sh --context first, or point
# Coolify at a build folder that holds this folder plus framework/schemas/data-store.json.
services:
  axf-data:
    build: .
    image: axf-data:latest
    container_name: axf-data
    restart: unless-stopped
    environment:
      AXF_DATA_DIR: /data
      AXF_DATA_TOKENS_FILE: /run/axf-data/tokens.json
      AXF_DATA_KEYS_URL: ${AXF_DATA_KEYS_URL:-}
    volumes:
      - axf-data:/data
      - /root/hub/data/axf-data/conf/tokens.json:/run/axf-data/tokens.json:ro
    networks: [axf-data]
    labels:
      traefik.enable: "false"
volumes:
  axf-data:
    name: axf-data
networks:
  axf-data:
    name: axf-data
    internal: true
