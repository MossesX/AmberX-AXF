name: Build and publish site

# Builds apps/demo and publishes dist/ to the `site` branch.
# The VPS (set up once with deploy/install.sh) pulls that branch every 2 minutes,
# so no server credentials are stored in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/demo/package-lock.json

      - name: Validate AmberX AXF app
        run: node framework/cli/axf.mjs validate apps/demo

      - name: Install
        working-directory: apps/demo
        run: npm ci

      - name: Build
        working-directory: apps/demo
        run: npm run build

      - name: Publish to site branch
        run: |
          cd apps/demo/dist
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          echo "::notice::Published build ${GITHUB_SHA::7} to the site branch. The VPS picks it up within 2 minutes."
