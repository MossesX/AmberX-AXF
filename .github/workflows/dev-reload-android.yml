name: Dev reload (Android, end to end)

# Device hot reload from `axf dev` on an emulator (build x.engine.dev s2). Builds the framework + the AXF Dev
# Console, starts `axf dev --framework` on the runner, launches the app pointed at http://10.0.2.2:7070 (the
# emulator's view of the runner) with hot reload on, edits a color theme on disk and asserts the screen changed
# (framework/cli/dev-reload-e2e.mjs: raw before/after frames, pixel diff > 0).
#
# Manual only for now: the app reads `axf.devServer` / `axf.hotReload` from launch extras once the Kotlin twin lands
# (framework/spec/PORTING.md → "Deferred: dev server launch extras"). Until then this run is expected to fail at the
# pixel-diff assert. Run it: Actions → Dev reload (Android) → Run workflow.

on:
  workflow_dispatch:
    inputs:
      ref: { description: 'Branch or commit', required: false, default: '' }
      theme: { description: 'Color theme to edit (must be the app default to show a diff)', required: false, default: 'arctic-daylight' }

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.ref || github.ref }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (API 35 + build-tools)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Framework modules → mavenLocal
        working-directory: framework/android
        run: gradle publishToMavenLocal --no-daemon 2>&1 | tail -20
      - name: Build the AXF Dev Console
        working-directory: apps/console
        run: |
          gradle :app:assembleDebug --no-daemon 2>&1 | tail -15
          cp app/build/outputs/apk/debug/*.apk "$RUNNER_TEMP/console.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get -qq install -y imagemagick > /dev/null || true
      - name: axf dev → emulator, edit a theme, compare screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: >-
            node framework/cli/dev-reload-e2e.mjs --package ai.amberx.axf.console --apk "$RUNNER_TEMP/console.apk"
            --theme "${{ github.event.inputs.theme || 'arctic-daylight' }}" --host-url http://10.0.2.2:7070 --out shots/dev-reload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-reload-shots
          path: shots/dev-reload/
          retention-days: 14
