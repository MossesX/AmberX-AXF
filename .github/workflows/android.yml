name: Android framework + console

# Builds everything the sandbox cannot (Maven + Android SDK): the kernel tests, every framework module,
# the Dev Console APK, and the build-engine sweep. Artifacts: console-debug.apk + framework maven repo.

on:
  push:
    branches: [main]
    paths: ['framework/**', 'apps/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: write

jobs:
  engine:
    name: Build engine sweep (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node framework/cli/axf.mjs validate --framework
      - run: node framework/cli/tracker.mjs --check
      - run: node framework/cli/project.mjs validate --all          # every project manifest (the build rule)
      - run: node framework/spec/check-project-fixtures.mjs          # JS validator = reference fixtures
      - run: node framework/cli/axf.mjs libraries
      - name: Libraries and plugins conform to the theme engines
        run: node framework/cli/check-theme.mjs
      - name: Session check-in plugin (installer keeps other hooks, archive scrubs secrets, hook output)
        run: node apps/console-web/plugins/session-checkin/test.mjs
      - name: Project wizard plugin (new AXF app / GitHub / folder sources, GitHub + VPS homes, Claude.ai kit, folder guard)
        run: node apps/console-web/plugins/project-wizard/test.mjs
      - name: Plugin lifecycle — plugins that follow plugin-lifecycle@1 have install/uninstall scripts and no stale references
        run: |
          set -e
          for f in $(node -e "for (const p of JSON.parse(require('child_process').execSync('node framework/cli/plugin-lifecycle.mjs list --json')).items) if (p.lifecycle) console.log(p.folder)"); do node framework/cli/plugin-lifecycle.mjs check $f; done
      - name: init every template + boilerplate, install a library, import a UI library
        run: |
          set -e
          for t in react-ts next-ts android-compose; do node framework/cli/axf.mjs init /tmp/sweep/t-$t --name "T $t" --template $t; done
          (cd /tmp/sweep/t-next-ts && npm install --silent && npm run build)
          for b in $(node -e "console.log(require('./framework/boilerplates/index.json').items.map(i=>i.id).join(' '))"); do node framework/cli/axf.mjs init /tmp/sweep/b-$b --name "B $b" --template android-compose --boilerplate $b > /dev/null; done
          node framework/cli/axf.mjs install browser /tmp/sweep/t-android-compose --yes
          mkdir -p /tmp/fakelib && printf 'package x\nval c = Color(0xFF7C3AED)\nval s = MaterialTheme.colorScheme.surface\n' > /tmp/fakelib/A.kt
          node framework/cli/axf.mjs import-ui --name "Fake UI" --kit fake --source local --path /tmp/fakelib --apply /tmp/sweep/t-android-compose
          node framework/cli/axf.mjs validate /tmp/sweep/t-android-compose

  console:
    name: Web Dev Console (React/TS) + Python API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Re-bake the framework into the console and build it
        working-directory: apps/console-web
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          # Build with the plugin template installed, so the template and the plugin loader stay valid.
          cp -r plugins/_template plugins/ci-example && sed -i "s/const FOLDER = 'example'/const FOLDER = 'ci-example'/" plugins/ci-example/web/index.tsx
          npm ci && npm run build
      - name: Theme swap — every colour and transparency follows the active colour and style themes
        working-directory: apps/console-web
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/theme-swap.mjs
      - name: Alerts — engine matches the fixture (TS, Python), conflict detection, console alert server, web push encryption
        run: |
          pip install -r apps/console-web/server/requirements.txt httpx
          (cd framework && npm install --no-audit --no-fund --silent)
          npx -y tsx framework/spec/check-alerts.mts
          python apps/console-web/server/test_alerts.py
      - name: Plugin Python self-tests (every plugins/*/test.py; found by glob so removing a plugin never breaks CI)
        run: |
          pip install -r apps/console-web/server/requirements.txt httpx
          for t in apps/console-web/plugins/[!_]*/test.py; do [ -f "$t" ] || continue; echo "== $t"; python "$t"; done
      - name: Library templates — generate every template for web + Python and compile them
        run: |
          set -e
          cd framework && npm install --no-audit --no-fund --silent && cd ..
          for t in $(ls framework/library-templates | grep -v '\.'); do node framework/cli/axf.mjs new-library ci-$t --template $t --ports web,python > /dev/null; node framework/cli/axf.mjs compile-library ci-$t; done
      - name: Python API + MCP smoke (health, libraries, init + install, build queue, MCP tools)
        working-directory: apps/console-web/server
        run: |
          pip install -r requirements.txt httpx
          python - <<'PY'
          import main
          from fastapi.testclient import TestClient
          c = TestClient(main.app)
          assert c.get('/api/health').json()['engine']
          assert c.get('/api/libraries').json()['items']
          r = c.post('/api/init', json={'dir': 'apps/ci-smoke', 'name': 'CI', 'template': 'android-compose', 'boilerplate': 'notes'}).json(); assert r['ok'], r
          r = c.post('/api/install', json={'dir': 'apps/ci-smoke', 'library': 'ai.amberx.axf.browser', 'params': {}}).json(); assert r['ok'], r
          print('api ok', len(c.get('/api/terminal').json()['lines']), 'terminal lines')
          plugins = {p['folder']: p for p in c.get('/api/plugins').json()['items']}
          assert plugins['ci-example']['server'] == 'loaded' and plugins['ci-example']['error'] is None, plugins
          assert c.get('/api/plugins/ci-example/hello').json()['message'], 'plugin route'
          print('plugins ok', sorted(plugins))
          with TestClient(main.app) as m:  # lifespan on: the MCP session manager runs
              h = {'accept': 'application/json, text/event-stream'}
              tools = m.post('/mcp', json={'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list'}, headers=h).json()['result']['tools']
              assert {'build_next', 'build_step', 'plan_search', 'build_reprocess'} <= {t['name'] for t in tools}, tools
              r = m.post('/mcp', json={'jsonrpc': '2.0', 'id': 2, 'method': 'tools/call', 'params': {'name': 'build_queue', 'arguments': {}}}, headers=h).json()['result']
              assert not r.get('isError'), r
              q = m.get('/api/build-queue').json(); assert q['view']['steps'], q
              print('mcp ok', len(tools), 'tools; next build step', q['view']['next'])
              sc = m.get('/api/system/check').json(); assert sc['checks'] and sc['services'], sc
              assert any(c['id'] == 'console-token' for c in sc['checks'])
              bad = m.post('/api/system/secret', json={'key': 'PATH', 'value': 'x'}); assert bad.status_code == 400, bad.text
              print('systems check ok:', sc['counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: console-web-dist
          path: apps/console-web/dist

  android:
    name: Gradle — framework modules, kernel tests, console APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK (preinstalled on ubuntu-latest; make sure API 35 + build-tools are there)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Kernel unit + conformance tests
        working-directory: framework/android
        run: gradle :axf-kernel:test --no-daemon --stacktrace 2>&1 | tee /tmp/test-kernel.log; exit ${PIPESTATUS[0]}
      - name: Report kernel test failures (readable without artifact downloads)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          {
            echo "### Kernel test failures — ${{ github.sha }}"; echo; echo '```'
            grep -hE "^e: |FAILED|What went wrong|Exception|Error:|expected" /tmp/test-kernel.log 2>/dev/null | sed 's|/home/runner/work/AmberX-AXF/AmberX-AXF/||' | head -80
            for f in framework/android/axf-kernel/build/test-results/test/*.xml; do [ -f "$f" ] && grep -A6 "<failure" "$f" | head -40; done
            echo '```'
          } > /tmp/test-report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-report.md || true
          else N=$(gh issue list --search "CI build errors in:title" --state open --json number --jq '.[0].number'); if [ -z "$N" ]; then gh issue create --title "CI build errors" --body-file /tmp/test-report.md; else gh issue comment "$N" --body-file /tmp/test-report.md; fi; fi
      - name: Generate one library per library template (compiled with the framework modules below)
        run: for t in $(ls framework/library-templates | grep -v '\.'); do node framework/cli/axf.mjs new-library ci-$t --template $t --ports android > /dev/null; done
      - name: Build every framework module
        working-directory: framework/android
        run: gradle assembleDebug publishToMavenLocal --no-daemon --continue 2>&1 | tee /tmp/build-framework.log; exit ${PIPESTATUS[0]}
      - name: Build the Dev Console
        working-directory: apps/console
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build-console.log; exit ${PIPESTATUS[0]}
      - name: Report compiler errors to the "CI build errors" issue (readable without artifact downloads)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { echo "### ${{ github.sha }} — $(date -u +%FT%TZ)"; echo; echo '```'; grep -hE "^e: |error:|What went wrong|> Task .* FAILED|Could not resolve|Unresolved|Execution failed" /tmp/build-framework.log /tmp/build-console.log 2>/dev/null | sed 's|/home/runner/work/AmberX-AXF/AmberX-AXF/||' | sort -u | head -300; echo '```'; } > /tmp/report.md
          N=$(gh issue list --search "CI build errors in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "CI build errors" --body-file /tmp/report.md; else gh issue comment "$N" --body-file /tmp/report.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: console-debug.apk
          path: apps/console/app/build/outputs/apk/debug/*.apk
      - name: Maven repo of every framework module (ai.amberx.axf:<module>:<version>)
        uses: actions/upload-artifact@v4
        with:
          name: axf-maven-repo
          path: ~/.m2/repository/ai/amberx/axf/**
      - name: Publish framework modules to GitHub Packages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: framework/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publishAllPublicationsToGitHubPackagesRepository --no-daemon 2>&1 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-test-reports
          path: framework/android/axf-kernel/build/reports/tests/**
