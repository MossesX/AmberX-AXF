name: Android framework + console

# Builds everything the sandbox cannot (Maven + Android SDK): the kernel tests, every framework module,
# the Dev Console APK, and the build-engine sweep. Artifacts: console-debug.apk + framework maven repo.

on:
  push:
    branches: [main]
    paths: ['framework/**', 'apps/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  packages: write

jobs:
  engine:
    name: Build engine sweep (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: node framework/cli/axf.mjs validate --framework
      - run: node framework/cli/tracker.mjs --check
      - run: node framework/cli/plugins.mjs --check
      - run: node framework/cli/project.mjs validate --all          # every project manifest (the build rule)
      - run: node framework/spec/check-project-fixtures.mjs          # JS validator = reference fixtures
      - run: node framework/spec/check-plugin-catalog.mjs            # plugin-catalog@1: pack, publish, verify, install guards
      - run: node framework/spec/check-axf-server.mjs                # wall-signature + plugin-package fixtures still match their references
      - run: node framework/spec/check-build-steps.mjs              # small-steps rule: pending + build-queue step cores
      - run: node framework/cli/pending.mjs --check-steps            # warns (not fails) about open builds over 30 min without small steps
      - run: node framework/cli/build-queue.mjs --check-steps        # same for the build queue (read-only)
      - run: node framework/spec/check-github.mjs                    # lib-github: fixtures/github.json + Node client guards (= axf_server.github)
      - run: node framework/cli/axf.mjs libraries
      - name: Libraries and plugins conform to the theme engines
        run: node framework/cli/check-theme.mjs
      - name: Plugin and library controls are framework controls (they inherit the app's style)
        run: node framework/cli/check-controls.mjs
      - name: Session check-in plugin (installer keeps other hooks, archive scrubs secrets, hook output)
        run: node apps/console-web/plugins/session-checkin/test.mjs
      - name: Project wizard plugin (new AXF app / GitHub / folder sources, GitHub + VPS homes, Claude.ai kit, folder guard)
        run: node apps/console-web/plugins/project-wizard/test.mjs
      - name: Deploy helpers (framework/deploy) — bash -n, shellcheck, self-test; installers that source them
        run: |
          set -e
          for f in framework/deploy/*.sh deploy/install-console.sh framework/templates/web-fastapi-wall/deploy/install.sh; do bash -n "$f"; done
          pip install --quiet shellcheck-py==0.10.0.1
          shellcheck -x framework/deploy/*.sh
          bash framework/deploy/test.sh
      - name: Agent add-ons — every *.addon.json / addons/<id>/addon.json passes validateAddon (framework/core/agents.ts)
        run: npx -y tsx framework/spec/check-addons.mts
      - name: Plugin lifecycle — plugins that follow plugin-lifecycle@1 have install/uninstall scripts and no stale references
        run: |
          set -e
          for f in $(node -e "for (const p of JSON.parse(require('child_process').execSync('node framework/cli/plugin-lifecycle.mjs list --json')).items) if (p.lifecycle) console.log(p.folder)"); do node framework/cli/plugin-lifecycle.mjs check $f; done
      - name: init every template + boilerplate, install a library, import a UI library
        run: |
          set -e
          for t in react-ts next-ts android-compose web-fastapi-wall; do node framework/cli/axf.mjs init /tmp/sweep/t-$t --name "T $t" --template $t; done
          (cd /tmp/sweep/t-next-ts && npm install --silent && npm run build)
          # web + FastAPI behind the axHub wall: web build, server self-test, installer syntax + shellcheck (with the baked helpers)
          (cd /tmp/sweep/t-web-fastapi-wall && npm install --silent && npm run build && pip install --quiet -r server/requirements.txt httpx && python3 server/test_server.py && bash -n deploy/install.sh && shellcheck -x deploy/install.sh)
          for b in $(node -e "console.log(require('./framework/boilerplates/index.json').items.map(i=>i.id).join(' '))"); do node framework/cli/axf.mjs init /tmp/sweep/b-$b --name "B $b" --template android-compose --boilerplate $b > /dev/null; done
          node framework/cli/axf.mjs install browser /tmp/sweep/t-android-compose --yes
          mkdir -p /tmp/fakelib && printf 'package x\nval c = Color(0xFF7C3AED)\nval s = MaterialTheme.colorScheme.surface\n' > /tmp/fakelib/A.kt
          node framework/cli/axf.mjs import-ui --name "Fake UI" --kit fake --source local --path /tmp/fakelib --apply /tmp/sweep/t-android-compose
          node framework/cli/axf.mjs validate /tmp/sweep/t-android-compose

  console:
    name: Web Dev Console (React/TS) + Python API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Re-bake the framework into the console and build it
        working-directory: apps/console-web
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          # Build with the plugin template installed, so the template and the plugin loader stay valid.
          cp -r plugins/_template plugins/ci-example && sed -i "s/const FOLDER = 'example'/const FOLDER = 'ci-example'/" plugins/ci-example/web/index.tsx
          # a plugin made from the template records the model that built it (build-defaults@1 plugin.builtWith.*)
          sed -i 's/"builtWith": { "model": "", "builtAt": "" }/"builtWith": { "model": "opus", "builtAt": "2026-10-23" }/' plugins/ci-example/plugin.json
          npm ci && npm run build
      - name: axhub-web — re-bake the framework into it and build it
        working-directory: apps/axhub-web
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          npm install --no-audit --no-fund --silent && npm run build
      - name: amberx-droid — re-bake the framework into it and build it
        working-directory: apps/amberx-droid
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          npm install --no-audit --no-fund --silent && npm run build
      - name: walkthrough-studio — re-bake the framework into it and build it
        working-directory: apps/walkthrough-studio
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          npm install --no-audit --no-fund --silent && npm run build
      - name: Theme swap — every colour and transparency follows the active colour and style themes
        working-directory: apps/console-web
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/theme-swap.mjs
          npx tsx scripts/interface-scope-check.mts     # two <InterfaceScope>s read their own interfaces, the app keeps its own
      - name: Alerts + MCP client + axf_server — engines match their fixtures (TS, Python), conflict detection, console alert server, web push encryption
        run: |
          set -o pipefail
          {
            pip install -r apps/console-web/server/requirements.txt httpx
            (cd framework && npm install --no-audit --no-fund --silent)
            npx -y tsx framework/spec/check-alerts.mts
            npx -y tsx framework/spec/check-widgets.mts
            npx -y tsx framework/spec/check-meters.mts                 # gauge + meter control assets: fixture replay, starters, enums
            npx -y tsx framework/spec/check-customize.mts              # tab-group asset + per-asset appearance tokens, 100 icon sets, apply to all
            npx -y tsx framework/spec/check-settings-ui.mts            # settings interface asset: fixture replay, starters, enums
            npx -y tsx framework/spec/check-design-package.mts         # design-package@1 + behavior-theme@1 rules, starters, the Amber context menu
            npx -y tsx framework/spec/check-brand.mts                  # logo-mark / animated-logo / icon-pack / branding rules, SVG output, starters
            npx -y tsx framework/spec/check-design-language.mts        # DESIGN-LANGUAGE.md quality bar over every starter + the brand generators
            npx -y tsx framework/spec/check-toolbars.mts               # toolbar library: live groups (providers), toggles, widgets, TOOLBARS.md + asset-library.mjs --check
            npx -y tsx framework/spec/check-interface.mts              # interface@1 + scopes: rules, resolution, scoped sheets, runtime scoped view
            npx -y tsx framework/spec/check-roller.mts                 # interface roller: every rolled asset validates, structure kept, reproducible
            npx -y tsx framework/spec/check-app-menu.mts                # app-menu engine: fixture replay, validators agree, runtime contributions + live lists
            npx -y tsx apps/console-web/scripts/menu-reach.mts          # console app menu reaches every nav entry, toolbar item and page (toolbar + nav hidden by default)
            npx -y tsx framework/spec/check-mcp.mts                    # MCP client: fixture replay + client against a fake Streamable HTTP server
            npx -y tsx framework/spec/check-appearance.mts             # appearance@1 document + runtime source + HubAppearanceSource against a fake hub
            npx -y tsx framework/spec/check-appearance-lock.mts        # look lock greys look controls + follow-axHub switch + Sliders clamp
            npx -y tsx framework/spec/check-hub.mts                    # lib-hub: hub-approvals.json replay (same file as Kotlin) + feed client + watcher
            npx -y tsx framework/spec/check-embed.mts                  # embed@1: embed.json + hide.json forced cases (same files as Kotlin) + runtime forced layer
            npx -y tsx framework/spec/check-banner-hide.mts            # banner Hide / Hide all / hide timer state + plugin@1 banner check
            npx -y tsx framework/spec/check-looktokens.mts             # look@1 tokens: only-changed storage, compact to no space, theme-token CSS
            npx -y tsx framework/spec/check-work.mts                   # work@1: work.json replay (same file as the kernel's WorkConformanceTest) + a host over the reducer
            npx -y tsx apps/axhub-web/test.mjs                         # AXHub web app: what a hub reply means, what is thrown away, sizes and times
            npx -y tsx apps/amberx-droid/test.mjs                      # AmberX: hub rules + voice command matching + monitoring / auto-approval rules
            npx -y tsx apps/walkthrough-studio/test.mts                # Walkthrough Studio: outline moves, trash, incremental compile, exports
            python framework/python/axf_libs/mcp/test.py              # Python MCP client replays the same fixture
            python framework/python/axf/contracts/test.py             # assistant@1 + agent-definition@1 Python ports replay their fixtures
            python framework/python/axf/assistant_host/test.py        # live-session@1 host, providers, safety (shared assistant host runtime)
            node framework/spec/check-axf-server.mjs                  # axf_server fixtures: wall signature + plugin-package@1 (= plugin-catalog.mjs)
            node framework/spec/check-github.mjs                      # lib-github (Node): fixtures/github.json + client guards
            python framework/python/axf_server/test.py                # axf_server: wall, storage, http, credentials, console client, plugin packages, github
            npx -y tsx framework/spec/check-plugin-inventory.mts
            npx -y tsx framework/spec/check-library-params.mts         # library@1 parameters: UI contract = CLI installer (Kotlin LibraryParamsTest replays the same fixture)
            npx -y tsx framework/spec/check-library-parts.mts          # library@1 parts (features inside a library): core/library.ts = CLI installer (Kotlin twin deferred)
            npx -y tsx framework/spec/check-ashes.mts                   # AshesUI: components, owners (plugin + model), contrast, rows, element tree
            npx -y tsx framework/spec/check-hubstatus.mts               # axHub status badge: red unless settings come live from axHub
            npx -y tsx framework/spec/check-hubstore.mts               # lib-hubstore: settings + tables on a fake axHub data server, installer parts = runtime config
            npx -y tsx framework/spec/check-hubsync.mts                # lib-hubsync: look/settings/data config, follow source, settings mirror on a fake hub
            npx -y tsx framework/spec/check-web-client.mts             # SSE reader, API client library, typed catalog models (fixture + real files)
            python apps/console-web/server/test_alerts.py
            python apps/console-web/server/test_wall_users.py
            python apps/console-web/server/test_app_ci.py
            python apps/console-web/server/test_plugin_catalog.py
            python apps/console-web/server/test_app_catalog.py
          } 2>&1 | tee /tmp/web-tests.log
      - name: Report web/Python test failures to the "CI build errors" issue
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { echo "### Web/Python tests failed on \`${{ github.ref_name }}\` — ${{ github.sha }}"; echo; echo '```'; tail -n 80 /tmp/web-tests.log 2>/dev/null | sed 's|/home/runner/work/AmberX-AXF/AmberX-AXF/||'; echo '```'; } > /tmp/web-report.md
          N=$(gh issue list --search "CI build errors in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "CI build errors" --body-file /tmp/web-report.md; else gh issue comment "$N" --body-file /tmp/web-report.md; fi
      - name: Plugin Python self-tests (every plugins/*/test.py; found by glob so removing a plugin never breaks CI)
        run: |
          pip install -r apps/console-web/server/requirements.txt httpx
          for t in apps/console-web/plugins/[!_]*/test.py; do [ -f "$t" ] || continue; echo "== $t"; python "$t"; done
      - name: Plugin pure-part self-tests (every plugins/*/test.mts; found by glob so removing a plugin never breaks CI)
        run: |
          for t in apps/console-web/plugins/[!_]*/test.mts; do [ -f "$t" ] || continue; echo "== $t"; node --experimental-strip-types "$t"; done
      - name: Library templates — generate every template for web + Python and compile them
        run: |
          set -e
          cd framework && npm install --no-audit --no-fund --silent && cd ..
          for t in $(ls framework/library-templates | grep -v '\.'); do node framework/cli/axf.mjs new-library ci-$t --template $t --ports web,python > /dev/null; node framework/cli/axf.mjs compile-library ci-$t; done
      - name: Python API + MCP smoke (health, libraries, init + install, build queue, MCP tools)
        working-directory: apps/console-web/server
        run: |
          pip install -r requirements.txt httpx
          python - <<'PY'
          import main
          from fastapi.testclient import TestClient
          c = TestClient(main.app)
          assert c.get('/api/health').json()['engine']
          assert c.get('/api/libraries').json()['items']
          r = c.post('/api/init', json={'dir': 'apps/ci-smoke', 'name': 'CI', 'template': 'android-compose', 'boilerplate': 'notes'}).json(); assert r['ok'], r
          r = c.post('/api/install', json={'dir': 'apps/ci-smoke', 'library': 'ai.amberx.axf.browser', 'params': {}}).json(); assert r['ok'], r
          print('api ok', len(c.get('/api/terminal').json()['lines']), 'terminal lines')
          plugins = {p['folder']: p for p in c.get('/api/plugins').json()['items']}
          assert plugins['ci-example']['server'] == 'loaded' and plugins['ci-example']['error'] is None, plugins
          assert c.get('/api/plugins/ci-example/hello').json()['message'], 'plugin route'
          print('plugins ok', sorted(plugins))
          with TestClient(main.app) as m:  # lifespan on: the MCP session manager runs
              h = {'accept': 'application/json, text/event-stream'}
              tools = m.post('/mcp', json={'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list'}, headers=h).json()['result']['tools']
              assert {'build_next', 'build_step', 'plan_search', 'build_reprocess'} <= {t['name'] for t in tools}, tools
              r = m.post('/mcp', json={'jsonrpc': '2.0', 'id': 2, 'method': 'tools/call', 'params': {'name': 'build_queue', 'arguments': {}}}, headers=h).json()['result']
              assert not r.get('isError'), r
              q = m.get('/api/build-queue').json(); assert q['view']['steps'], q
              print('mcp ok', len(tools), 'tools; next build step', q['view']['next'])
              sc = m.get('/api/plugins/systems-check/check').json(); assert sc['checks'] and sc['services'], sc  # axf-plugin:systems-check
              assert any(c['id'] == 'console-token' for c in sc['checks'])  # axf-plugin:systems-check
              bad = m.post('/api/plugins/systems-check/secret', json={'key': 'PATH', 'value': 'x'}); assert bad.status_code == 400, bad.text  # axf-plugin:systems-check
              print('systems check ok:', sc['counts'])  # axf-plugin:systems-check
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: console-web-dist
          path: apps/console-web/dist

  amberx:
    name: AmberX — web app in the Capacitor Android shell (APK + native unit tests)
    runs-on: ubuntu-latest
    env:
      AXF_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Capacitor 8 builds with JDK 21 and compileSdk 36.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
      - name: Stable debug signing key (secret ANDROID_DEBUG_KEYSTORE, base64)
        env: { KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}' }
        run: if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - name: Build the web app, copy it into the shell
        working-directory: apps/amberx-droid
        run: |
          rm -rf src/axf && mkdir -p src/axf && for d in core react ui schemas libs; do cp -r ../../framework/$d src/axf/; done
          npm ci --no-audit --no-fund && npm run build && npx cap sync android
      - name: Native unit tests + debug APK
        working-directory: apps/amberx-droid/android
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: amberx-debug.apk
          path: apps/amberx-droid/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  android:
    name: Gradle — framework modules, kernel tests, console APK
    runs-on: ubuntu-latest
    # Waits for the AmberX shell so its APK joins the app catalog bundle; runs whatever that job's result.
    needs: amberx
    if: ${{ !cancelled() }}
    env:
      # Every app's versionCode = this run number, so each catalog build installs over the previous one.
      AXF_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Stable debug signing key (secret ANDROID_DEBUG_KEYSTORE, base64), so updates install without uninstalling
        env: { KS: '${{ secrets.ANDROID_DEBUG_KEYSTORE }}' }
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "using the stable debug key"
          else echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: APKs are signed with a fresh key, so installing an update needs an uninstall first"; fi
      - name: Android SDK (preinstalled on ubuntu-latest; make sure API 35 + build-tools are there)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Kernel unit + conformance tests
        working-directory: framework/android
        run: gradle :axf-kernel:test --no-daemon --stacktrace 2>&1 | tee /tmp/test-kernel.log; exit ${PIPESTATUS[0]}
      - name: Report kernel test failures (readable without artifact downloads)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          {
            echo "### Kernel test failures — ${{ github.sha }}"; echo; echo '```'
            grep -hE "^e: |FAILED|What went wrong|Exception|Error:|expected" /tmp/test-kernel.log 2>/dev/null | sed 's|/home/runner/work/AmberX-AXF/AmberX-AXF/||' | head -80
            for f in framework/android/axf-kernel/build/test-results/test/*.xml; do [ -f "$f" ] && grep -A6 "<failure" "$f" | head -40; done
            echo '```'
          } > /tmp/test-report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-report.md || true
          else N=$(gh issue list --search "CI build errors in:title" --state open --json number --jq '.[0].number'); if [ -z "$N" ]; then gh issue create --title "CI build errors" --body-file /tmp/test-report.md; else gh issue comment "$N" --body-file /tmp/test-report.md; fi; fi
      - name: Generate one library per library template (compiled with the framework modules below)
        run: for t in $(ls framework/library-templates | grep -v '\.'); do node framework/cli/axf.mjs new-library ci-$t --template $t --ports android > /dev/null; done
      - name: Build every framework module
        working-directory: framework/android
        run: gradle assembleDebug publishToMavenLocal --no-daemon --continue 2>&1 | tee /tmp/build-framework.log; exit ${PIPESTATUS[0]}
      - name: Build the Dev Console
        working-directory: apps/console
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build-console.log; exit ${PIPESTATUS[0]}
      - name: Library unit tests (lib-voice, lib-lock, lib-mcp, lib-hub, lib-notifications, lib-work)
        working-directory: framework/android
        run: gradle :lib-voice:testDebugUnitTest :lib-lock:testDebugUnitTest :lib-mcp:testDebugUnitTest :lib-hub:testDebugUnitTest :lib-notifications:testDebugUnitTest :lib-work:testDebugUnitTest --no-daemon --continue 2>&1 | tee /tmp/test-libs.log; exit ${PIPESTATUS[0]}
      - name: Build Voice Vault (apps/voicevault) + its unit tests (voice notes rules)
        working-directory: apps/voicevault
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build-voicevault.log; exit ${PIPESTATUS[0]}
      - name: Build AXHub (apps/axhub-android) + its unit tests
        working-directory: apps/axhub-android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build-axhub.log; exit ${PIPESTATUS[0]}
      - name: Build every other framework Android app (apps/* found by app-bundle.mjs; new apps need no CI change)
        run: |
          set -o pipefail
          for d in $(node framework/cli/app-bundle.mjs list --android --dirs); do
            ls "$d"/app/build/outputs/apk/debug/*.apk >/dev/null 2>&1 && continue
            echo "== $d"; (cd "$d" && gradle :app:assembleDebug --no-daemon) 2>&1 | tee -a /tmp/build-apps.log
          done
      - name: AmberX APK from its own job (Capacitor shell) for the catalog bundle
        if: ${{ needs.amberx.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: amberx-debug.apk
          path: apps/amberx-droid/android/app/build/outputs/apk/debug/
      - name: App catalog bundle (every app's APK + apps.json, read by the Dev Console into the hub's app catalog)
        run: node framework/cli/app-bundle.mjs collect dist/app-apks --build "${{ github.run_number }}" --commit "${{ github.sha }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Report compiler errors to the "CI build errors" issue (readable without artifact downloads)
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { echo "### ${{ github.sha }} — $(date -u +%FT%TZ)"; echo; echo '```'; grep -hE "^e: |error:|What went wrong|> Task .* FAILED|Could not resolve|Unresolved|Execution failed" /tmp/build-framework.log /tmp/build-console.log /tmp/test-libs.log /tmp/build-voicevault.log /tmp/build-axhub.log /tmp/build-apps.log 2>/dev/null | sed 's|/home/runner/work/AmberX-AXF/AmberX-AXF/||' | sort -u | head -300; echo '```'; } > /tmp/report.md
          N=$(gh issue list --search "CI build errors in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create --title "CI build errors" --body-file /tmp/report.md; else gh issue comment "$N" --body-file /tmp/report.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: console-debug.apk
          path: apps/console/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: voicevault-debug.apk
          path: apps/voicevault/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: axhub-debug.apk
          path: apps/axhub-android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: patches-debug.apk
          path: apps/patches/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: dist/app-apks/
          retention-days: 30
      - name: Maven repo of every framework module (ai.amberx.axf:<module>:<version>)
        uses: actions/upload-artifact@v4
        with:
          name: axf-maven-repo
          path: ~/.m2/repository/ai/amberx/axf/**
      - name: Publish framework modules to GitHub Packages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: framework/android
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle publishAllPublicationsToGitHubPackagesRepository --no-daemon 2>&1 | tail -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-test-reports
          path: framework/android/axf-kernel/build/reports/tests/**
