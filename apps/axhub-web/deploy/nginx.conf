# AXHub web app: static files; every app route falls back to index.html (the framework's router runs in the browser).
# Since axHub decision #96 these are the hub's own pages (approvals included), so the owner's console may
# and the owner's AmberX and Molly apps may show them in a frame; nothing else may. Keep this list in step with the hub's
# own (DEFAULT_APPROVAL_FRAME_ANCESTORS): an approval link redirects here, and a frame needs both to allow it.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://console.amberxai.com https://molly.amberxai.com https://amberx.amberxai.com" always;
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Content-Security-Policy "frame-ancestors 'self' https://console.amberxai.com https://molly.amberxai.com https://amberx.amberxai.com" always; }
}
