# AXHub web app, retired (Nov 18 2026, build move-everything-axhub-web-console): every hub page lives in the Dev Console's
# Hub screens. This container only serves the redirect page: it reads the old `#/<route>` (the hub still sends its HTML
# pages here) and sends the browser to the console's deep link (deploy/redirect.mjs writes redirect.html from the
# hub-console@1 route table). The hub itself stays backend + MCP on its own address.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-ancestors 'self' https://console.amberxai.com" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files /redirect.html =404; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-ancestors 'self' https://console.amberxai.com" always; }
}
