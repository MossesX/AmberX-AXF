# Walkthrough Studio behind Coolify's Traefik (TLS there). Single-page app: unknown paths serve index.html.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Shown inside Patches and the Dev Console's App tabs (embed@1); nowhere else.
  add_header Content-Security-Policy "frame-ancestors 'self' https://patches.amberxai.com https://console.amberxai.com" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /assets/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable" always; add_header Content-Security-Policy "frame-ancestors 'self' https://patches.amberxai.com https://console.amberxai.com" always; }
  location = /index.html { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "frame-ancestors 'self' https://patches.amberxai.com https://console.amberxai.com" always; }
  location / { try_files $uri /index.html; }
}
