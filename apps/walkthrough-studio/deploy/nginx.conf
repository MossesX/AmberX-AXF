# Walkthrough Studio: static files; every app route falls back to index.html (the framework's router runs in the browser).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Frame-Options SAMEORIGIN always; }
}
