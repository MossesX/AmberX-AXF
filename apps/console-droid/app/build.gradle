plugins {
    id 'com.android.application'
}

android {
    namespace = "ai.amberx.consoleapp"
    compileSdk = 35
    defaultConfig {
        applicationId "ai.amberx.consoleapp"
        minSdkVersion 26
        targetSdkVersion 35
        // CI stamps the run number (AXF_BUILD_NUMBER) so every build installs over the last one.
        versionCode((System.getenv("AXF_BUILD_NUMBER") ?: "1") as Integer)
        versionName "0.1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    // The shell is plain Android (Activity, WebView, Service): no AndroidX runtime, so it stays small and rarely rebuilds.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
