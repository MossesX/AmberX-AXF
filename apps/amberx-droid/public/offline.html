<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmberX</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 360px; padding: 16px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 16px; opacity: .75; }
  button { font: inherit; padding: 12px 20px; border-radius: 8px; border: 1px solid ButtonBorder; background: ButtonFace; color: ButtonText; }
</style>
</head>
<body>
<main>
  <h1>AmberX can't reach its server</h1>
  <p>The app loads from amberx.amberxai.com. Check the phone's connection and try again.</p>
  <button type="button" onclick="location.replace('https://amberx.amberxai.com/')">Try again</button>
</main>
</body>
</html>
