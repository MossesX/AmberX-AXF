# Docker socket proxy for the Dev Console (Container access plugin). Allows ONLY what the console needs:
# list/inspect containers, the archive API (read/stat/write files), exec (create/start/resize/inspect), restart.
# Everything else (create, remove, kill, images, volumes, networks, swarm, build, events, system) is refused with 403.
global
  log stdout format raw daemon
  maxconn 256

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 2h
  timeout server 2h
  timeout tunnel 12h

frontend docker
  bind :2375
  acl v_ping     path -m reg ^(/v[0-9.]+)?/(_ping|version)$
  acl c_list     path -m reg ^(/v[0-9.]+)?/containers/json$
  acl c_inspect  path -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/json$
  acl c_archive  path -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/archive$
  acl c_exec     path -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/exec$
  acl c_restart  path -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/restart$
  acl e_run      path -m reg ^(/v[0-9.]+)?/exec/[a-f0-9]{8,128}/(start|resize)$
  acl e_json     path -m reg ^(/v[0-9.]+)?/exec/[a-f0-9]{8,128}/json$
  acl m_read     method GET HEAD
  http-request allow if m_read v_ping
  http-request allow if m_read c_list
  http-request allow if m_read c_inspect
  http-request allow if m_read c_archive
  http-request allow if METH_PUT c_archive
  http-request allow if METH_POST c_exec
  http-request allow if METH_POST e_run
  http-request allow if METH_GET e_json
  http-request allow if METH_POST c_restart
  http-request deny deny_status 403
  default_backend dockersocket

backend dockersocket
  server dockersocket /var/run/docker.sock
