# Molly: static files; every route falls back to index.html. Molly may frame the three apps it holds; nothing frames Molly.
server {
  listen 8080;
  root /usr/share/nginx/html;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; frame-src 'self' https://amberx.amberxai.com https://axhub.amberxai.com https://console.amberxai.com" always;
  }
}
